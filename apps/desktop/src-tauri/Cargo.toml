[package]
name = "opendict-desktop"
version = "0.1.0"
description = "OpenDict desktop application"
license = "GPL-3.0-or-later"
publish = false
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
name = "opendict_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
opendict-core.workspace = true
serde.workspace = true
serde_json.workspace = true
percent-encoding = "2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
# Mica and vibrancy, applied directly so the app knows whether they took (Tauri uses it too).
window-vibrancy = "0.8"

# Desktop only: in-app updates from GitHub Releases.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# Mica needs Windows 11: the build number decides.
[target.'cfg(target_os = "windows")'.dependencies]
windows-version = "0.1"

# Vibrancy shows through a transparent window, which macOS only allows with private API.
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = [] }

[dev-dependencies]
opendict-mdict-fixture.workspace = true
tempfile.workspace = true

[lints]
workspace = true
