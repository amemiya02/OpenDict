[workspace]
resolver = "3"
members = [
    "crates/mdict",
    "crates/mdict-fixture",
    "crates/opendict-core",
    "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/amemiya02/OpenDict"

[workspace.dependencies]
opendict-mdict = { path = "crates/mdict", version = "0.1.0" }
opendict-mdict-fixture = { path = "crates/mdict-fixture" }
opendict-core = { path = "crates/opendict-core" }
flate2 = "1"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
